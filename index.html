<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grafos al Parcial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: mapa de metro sobre papel cuadriculado; una columna de lectura (max 760px) y barra de pestañas fija abajo, pensada para el pulgar. */
:root{
  --paper:#EEF2F5; --grid:rgba(31,74,110,.07); --card:#FFFFFF; --ink:#12233A; --muted:#55677D; --line:#D2DBE4;
  --accent:#E4570E; --accent-soft:#FDE6D8; --tree:#137A8A; --tree-soft:#D6EEF1; --front:#E9A100; --front-soft:#FBF0D2;
  --good:#2B8A3E; --good-soft:#DDF3E2; --bad:#C92A2A; --bad-soft:#FBE1E1;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0D1622; --grid:rgba(120,170,220,.06); --card:#142233; --ink:#E4ECF4; --muted:#93A5B9; --line:#26384D;
  --accent:#FF7B36; --accent-soft:#3A2416; --tree:#3EB8CA; --tree-soft:#123440; --front:#F2B632; --front-soft:#3A2F12;
  --good:#58CF6E; --good-soft:#15331D; --bad:#FF6B6B; --bad-soft:#3D1B1B; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0D1622; --grid:rgba(120,170,220,.06); --card:#142233; --ink:#E4ECF4; --muted:#93A5B9; --line:#26384D;
  --accent:#FF7B36; --accent-soft:#3A2416; --tree:#3EB8CA; --tree-soft:#123440; --front:#F2B632; --front-soft:#3A2F12;
  --good:#58CF6E; --good-soft:#15331D; --bad:#FF6B6B; --bad-soft:#3D1B1B; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px));}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,9vw,3.4rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.7rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:28px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
b,strong{font-weight:700}
code,.mono{font-family:var(--f-mono);font-size:.88em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:700;font-size:.95rem;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:700;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--tree-soft);color:var(--tree);font-weight:600}
.tag.orange{background:var(--accent-soft);color:var(--accent)}
.tag.gold{background:var(--front-soft);color:var(--ink)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(6px, env(safe-area-inset-left, 0px));padding-right:max(6px, env(safe-area-inset-right, 0px));}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs a[aria-current="page"] svg .dot{fill:var(--accent)}

/* hero */
.hero{display:grid;gap:14px;padding-top:6px}
.hero .sub{font-size:1.05rem;color:var(--muted);max-width:52ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .n{font-family:var(--f-display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat .l{font-size:.78rem;color:var(--muted);line-height:1.3}
.go-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:108px}
.go .t{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.go .d{font-size:.86rem;color:var(--muted);line-height:1.35}
.go .line{height:5px;border-radius:3px;width:44px;margin-bottom:6px}
.freq{display:grid;gap:8px}
.freq .it{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.freq .bar{grid-column:1/-1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.freq .bar i{display:block;height:100%;background:var(--accent)}
.ojo{border-left:4px solid var(--front);background:var(--front-soft);padding:12px 14px;border-radius:0 10px 10px 0}
.ojo b{display:block;margin-bottom:2px}

/* königsberg */
.kb svg{width:100%;height:auto;max-width:420px;display:block;margin:0 auto}
.kb .msg{font-weight:700}

/* graph svg */
.gwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px;overflow:hidden}
.gwrap svg{width:100%;height:auto;display:block;max-height:300px}
svg .e{stroke:var(--line);stroke-width:2.5;fill:none}
svg .ah{fill:var(--line)}
svg .e.try{stroke:var(--accent);stroke-width:4;stroke-dasharray:7 5}
svg .ah.try{fill:var(--accent)}
svg .e.tree{stroke:var(--tree);stroke-width:5}
svg .ah.tree{fill:var(--tree)}
svg .e.path{stroke:var(--accent);stroke-width:6}
svg .ah.path{fill:var(--accent)}
svg .e.reject{stroke:var(--bad);stroke-width:2.5;stroke-dasharray:3 5;opacity:.75}
svg .ah.reject{fill:var(--bad)}
svg .w{font-family:var(--f-mono);font-size:13px;font-weight:600;fill:var(--muted);paint-order:stroke;stroke:var(--card);stroke-width:5px;text-anchor:middle;dominant-baseline:central}
svg .w.neg{fill:var(--bad)}
svg .n circle{fill:var(--card);stroke:var(--ink);stroke-width:2.5}
svg .n text{font-family:var(--f-display);font-weight:800;font-size:15px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
svg .n.front circle{fill:var(--front-soft);stroke:var(--front);stroke-width:3.5}
svg .n.cur circle{fill:var(--accent);stroke:var(--accent)}
svg .n.cur text{fill:#fff}
svg .n.done circle{fill:var(--tree);stroke:var(--tree)}
svg .n.done text{fill:#fff}
svg .nl{font-family:var(--f-mono);font-size:12px;font-weight:600;fill:var(--accent);text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);padding:4px 6px 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid}

/* player */
.player{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.panel,.sec,.stack,.stack-lg,.qcard,.answer{min-width:0}
.panel{grid-template-columns:minmax(0,1fr)}
.ptext{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:0 12px 12px 0;padding:12px 14px;min-height:76px}
.pcount{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pctl .btn{flex:1 1 auto;justify-content:center}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.panel{display:grid;gap:10px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;font-family:var(--f-mono);font-size:.82rem;font-variant-numeric:tabular-nums;width:100%}
table.t th,table.t td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
table.t th{background:var(--paper);font-weight:600}
table.t td.chg{background:var(--accent-soft);color:var(--accent);font-weight:700}
table.t td.kk,table.t th.kk{background:var(--tree-soft)}
table.t tr.fin td{color:var(--tree);font-weight:700}
.q-items{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:34px}
.q-items .qi{font-family:var(--f-mono);font-weight:600;border:1.5px solid var(--front);background:var(--front-soft);border-radius:7px;padding:3px 10px}
.q-items .empty{color:var(--muted);font-style:italic;font-size:.88rem}
.plabel{font-size:.78rem;font-weight:700;color:var(--muted)}
.estatus{font-family:var(--f-mono);font-size:.78rem;padding:2px 6px;border-radius:5px}
.estatus.ok{background:var(--tree-soft);color:var(--tree)}
.estatus.no{background:var(--bad-soft);color:var(--bad)}
.estatus.cur{background:var(--accent-soft);color:var(--accent)}

/* algorithm list & detail */
.alg-group{display:grid;gap:10px}
.alg-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;width:100%;text-decoration:none;color:inherit}
.alg-item .stn{width:16px;height:16px;border-radius:50%;border:4px solid var(--c, var(--accent));background:var(--card)}
.alg-item .nm{font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.2}
.alg-item .ds{font-size:.85rem;color:var(--muted);line-height:1.35}
.alg-item .ar{color:var(--muted);font-size:1.3rem}
.line-head{display:flex;align-items:center;gap:10px}
.line-head .bar{flex:1;height:4px;border-radius:2px;background:var(--c)}
.back{background:none;border:0;padding:6px 0;font-weight:700;color:var(--accent);display:inline-flex;gap:6px;align-items:center}
.sec{display:grid;gap:8px}
.sec h3{display:flex;gap:8px;align-items:baseline}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:8px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-weight:600;font-size:.85rem;display:grid;place-items:center}
ul.dots{margin:0;padding-left:20px;display:grid;gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.95rem}
.kv dt{font-weight:700}
.kv dd{margin:0;min-width:0}
.truco{background:var(--tree-soft);border-radius:12px;padding:12px 14px;font-weight:700}
.truco span{display:block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--tree);margin-bottom:2px}
.qa{display:grid;gap:4px;padding:12px 0;border-top:1px dashed var(--line)}
.qa:first-of-type{border-top:0;padding-top:0}
.qa .q{font-weight:700}
.toggle{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.toggle button{border:0;background:var(--card);padding:7px 14px;font-weight:700;font-size:.88rem}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.formula{font-family:var(--f-mono);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.88rem;overflow-x:auto;white-space:nowrap}

/* repr */
.repr-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.repr-tabs .chip{white-space:nowrap}
.lst{font-family:var(--f-mono);font-size:.9rem;display:grid;gap:4px}
.arr{display:flex;gap:0;flex-wrap:wrap}
.arr span{border:1px solid var(--line);padding:4px 9px;font-family:var(--f-mono);font-size:.85rem;margin:-1px 0 0 -1px;background:var(--card)}
.arr span.h{background:var(--tree-soft)}
.arr .idx{font-size:.65rem;color:var(--muted);display:block;text-align:center}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc > div{border-radius:10px;padding:10px 12px;font-size:.9rem}
.pc .pro{background:var(--good-soft)}
.pc .con{background:var(--bad-soft)}
.pc b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}

/* glossary */
.search{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font:inherit;color:inherit}
.gl-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.gl-item .term{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.gl-item .ojo{margin-top:6px;font-size:.9rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips .chip{white-space:nowrap}

/* quiz */
.qcard{display:grid;gap:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qtext{font-family:var(--f-display);font-weight:700;font-size:1.3rem;line-height:1.25}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:.98rem;min-height:50px}
.opt .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:600}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt.ko .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.exp{border-radius:12px;padding:12px 14px;font-size:.95rem}
.exp.ok{background:var(--good-soft)}
.exp.ko{background:var(--bad-soft)}
.exp b{display:block}
.streak{font-weight:700;color:var(--accent)}
.score-big{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{justify-content:center;padding:9px 8px;font-size:.88rem}
.answer{display:grid;gap:10px}
.checklist{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.checklist li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:.95rem}
.checklist li::before{content:"";width:18px;height:18px;border-radius:5px;border:2px solid var(--tree);margin-top:3px}

/* match */
.mgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:8px}
.mcol{display:grid;gap:8px;align-content:start}
.mbtn{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:.88rem;line-height:1.3;min-height:58px;transition:transform .15s, opacity .3s}
.mbtn.term{font-family:var(--f-display);font-weight:700;font-size:.98rem}
.mbtn.sel{border-color:var(--accent);background:var(--accent-soft)}
.mbtn.done{border-color:var(--good);background:var(--good-soft);opacity:.55}
.mbtn.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.timer{font-family:var(--f-mono);font-weight:600;font-size:1.4rem;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){ .stats .stat .n{font-size:1.35rem} .qtext{font-size:1.18rem} .pc{grid-template-columns:1fr} }
</style></head><body>

<main class="wrap" id="app"></main>

<script>
/* ============ utilidades ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem('gp_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('gp_' + k, JSON.stringify(v)); } catch (e) {} }
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = x => x === Infinity ? '∞' : String(x);
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

/* ============ glosario ============ */

const ek = (g, u, v) => g.directed ? u + '>' + v : (u < v ? u + '-' + v : v + '-' + u);
function adjOf(g) {
  const a = {}; Object.keys(g.pos).forEach(n => a[n] = []);
  g.edges.forEach(([u, v, w]) => { a[u].push([v, w]); if (!g.directed) a[v].push([u, w]); });
  Object.values(a).forEach(l => l.sort((x, y) => x[0] < y[0] ? -1 : 1));
  return a;
}
const snap = o => JSON.parse(JSON.stringify(o));

function drawGraph(g, st = {}) {
  const R = 17, nodes = st.nodes || {}, edges = st.edges || {}, labels = st.labels || {};
  let out = '';
  g.edges.forEach(([u, v, w]) => {
    const [x1, y1] = g.pos[u], [x2, y2] = g.pos[v];
    const k = ek(g, u, v), cls = edges[k] || '';
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    const sx = x1 + ux * R, sy = y1 + uy * R;
    const ex = x2 - ux * (R + (g.directed ? 9 : 0)), ey = y2 - uy * (R + (g.directed ? 9 : 0));
    out += `<line class="e ${cls}" x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}"/>`;
    if (g.directed) {
      const tx = x2 - ux * R, ty = y2 - uy * R, bx = tx - ux * 12, by = ty - uy * 12, px = -uy * 6, py = ux * 6;
      out += `<polygon class="ah ${cls}" points="${tx},${ty} ${bx + px},${by + py} ${bx - px},${by - py}"/>`;
    }
    const mx = (x1 + x2) / 2 - uy * 11, my = (y1 + y2) / 2 + ux * 11;
    out += `<text class="w ${w < 0 ? 'neg' : ''}" x="${mx}" y="${my}">${w}</text>`;
  });
  Object.entries(g.pos).forEach(([n, [x, y]]) => {
    out += `<g class="n ${nodes[n] || ''}"><circle cx="${x}" cy="${y}" r="${R}"/><text x="${x}" y="${y + 1}">${n}</text></g>`;
    if (labels[n] != null && labels[n] !== '') out += `<text class="nl" x="${x}" y="${y - R - 7}">${labels[n]}</text>`;
  });
  return `<svg viewBox="0 0 374 250" role="img" aria-label="Grafo de ejemplo">${out}</svg>`;
}
const LEGEND = `<div class="legend"><span><i style="border-color:var(--front);background:var(--front-soft)"></i>En espera / tentativo</span><span><i style="border-color:var(--accent);background:var(--accent)"></i>Actual</span><span><i style="border-color:var(--tree);background:var(--tree)"></i>Listo</span><span><i style="border-color:var(--bad);border-style:dashed"></i>Descartada</span></div>`;

/* ============ generadores de pasos ============ */
function recorder() {
  const s = { nodes: {}, edges: {}, labels: {}, steps: [] };
  s.push = (text, panel) => s.steps.push({ nodes: snap(s.nodes), edges: snap(s.edges), labels: snap(s.labels), text, panel });
  return s;
}
const qbox = (label, items, hint) => `<div><div class="plabel">${label}${hint ? ` <span class="muted">· ${hint}</span>` : ''}</div><div class="q-items">${items.length ? items.map(x => `<span class="qi">${x}</span>`).join('') : '<span class="empty">vacía</span>'}</div></div>`;

function genBFS(g) {
  const A = adjOf(g), r = recorder();
  const q = ['A'], vis = { A: true }, lvl = { A: 0 }, order = [];
  r.nodes.A = 'front'; r.labels.A = 'nivel 0';
  const pan = () => qbox('Cola (FIFO)', q, 'sale el de la izquierda') + qbox('Orden de visita', order);
  r.push('Empezamos en <b>A</b>: lo marcamos como visitado (nivel 0) y lo metemos en la cola.', pan());
  while (q.length) {
    const u = q.shift(); r.nodes[u] = 'cur';
    const seen = A[u].map(x => x[0]).filter(v => vis[v]);
    r.push(`Sacamos <b>${u}</b> del frente de la cola y revisamos sus vecinos en orden alfabético.${seen.length ? ` Ya estaban visitados: ${seen.join(', ')} (se ignoran).` : ''}`, pan());
    for (const [v] of A[u]) {
      if (vis[v]) continue;
      vis[v] = true; lvl[v] = lvl[u] + 1; q.push(v);
      r.nodes[v] = 'front'; r.edges[ek(g, u, v)] = 'tree'; r.labels[v] = 'nivel ' + lvl[v];
      r.push(`<b>${v}</b> no estaba visitado: lo marcamos (nivel ${lvl[v]}) y lo metemos al <b>final</b> de la cola.`, pan());
    }
    r.nodes[u] = 'done'; order.push(u);
  }
  r.push(`Cola vacía, terminamos. Orden BFS: <b>${order.join(' → ')}</b>. Las aristas verdes forman el árbol BFS: cada nodo quedó con la menor cantidad posible de aristas desde A.`, pan());
  return r.steps;
}

function genDFS(g) {
  const A = adjOf(g), r = recorder();
  const st = ['A'], vis = {}, parent = {}, order = [];
  r.nodes.A = 'front';
  const pan = () => qbox('Pila (LIFO)', st, 'el tope es el de la derecha') + qbox('Orden de visita', order);
  r.push('Metemos <b>A</b> en la pila.', pan());
  while (st.length) {
    const u = st.pop();
    if (vis[u]) { r.push(`Sacamos <b>${u}</b> del tope, pero ya estaba visitado: se descarta (aquí se nota el <i>backtracking</i>).`, pan()); continue; }
    vis[u] = true; order.push(u); r.nodes[u] = 'cur'; r.labels[u] = '#' + order.length;
    if (parent[u]) r.edges[ek(g, parent[u], u)] = 'tree';
    const nb = A[u].map(x => x[0]).filter(v => !vis[v]);
    nb.slice().reverse().forEach(v => { st.push(v); parent[v] = u; r.nodes[v] = 'front'; });
    r.push(`Sacamos <b>${u}</b> del tope y lo visitamos (#${order.length}).${nb.length ? ` Apilamos sus vecinos no visitados (${nb.join(', ')}) al revés, para que el primero alfabético quede arriba.` : ' No tiene vecinos sin visitar: toca retroceder.'}`, pan());
    r.nodes[u] = 'done';
  }
  r.push(`Pila vacía, terminamos. Orden DFS: <b>${order.join(' → ')}</b>. Fíjate que DFS bajó A → B → C → E antes de volver: va a lo profundo primero.`, pan());
  return r.steps;
}

function distTable(N, d, prev, fin, extra) {
  return `<div class="tscroll"><table class="t"><tr><th>nodo</th><th>d</th><th>prev</th><th>estado</th></tr>${N.map(n => `<tr class="${fin && fin[n] ? 'fin' : ''}"><td>${n}</td><td>${fmt(d[n])}</td><td>${prev[n] || '–'}</td><td>${fin ? (fin[n] ? '<span class="estatus ok">permanente</span>' : (d[n] < Infinity ? '<span class="estatus cur">tentativo</span>' : '–')) : (extra ? extra(n) : '')}</td></tr>`).join('')}</table></div>`;
}

function genDijkstra(g, target = 'F') {
  const A = adjOf(g), N = Object.keys(g.pos).sort(), r = recorder();
  const d = {}, prev = {}, fin = {};
  N.forEach(n => { d[n] = Infinity; prev[n] = null; r.labels[n] = '∞'; });
  d.A = 0; r.labels.A = '0'; r.nodes.A = 'front';
  const pan = () => distTable(N, d, prev, fin);
  r.push('Inicio: d(A) = 0 y todos los demás en ∞. Nadie tiene etiqueta permanente todavía.', pan());
  while (true) {
    let u = null;
    N.forEach(n => { if (!fin[n] && d[n] < Infinity && (u === null || d[n] < d[u])) u = n; });
    if (u === null) break;
    fin[u] = true; r.nodes[u] = 'cur';
    if (prev[u]) r.edges[ek(g, prev[u], u)] = 'tree';
    r.push(`Escogemos el nodo <b>no etiquetado</b> con menor distancia: <b>${u}</b> (d = ${d[u]}). Su etiqueta queda <b>permanente</b>: ya nada la puede mejorar porque no hay pesos negativos.`, pan());
    for (const [v, w] of A[u]) {
      if (fin[v]) continue;
      const k = ek(g, u, v), old = r.edges[k], alt = d[u] + w, before = d[v];
      r.edges[k] = 'try';
      if (alt < d[v]) {
        d[v] = alt; prev[v] = u; r.labels[v] = String(alt); r.nodes[v] = 'front';
        r.push(`Revisamos ${u}–${v}: d(${u}) + ${w} = ${alt} &lt; ${fmt(before)} → <b>mejora</b>. Ahora d(${v}) = ${alt} y prev(${v}) = ${u}.`, pan());
      } else {
        r.push(`Revisamos ${u}–${v}: d(${u}) + ${w} = ${alt} ≥ ${fmt(before)} → no mejora${alt === before ? ' (empate)' : ''}, se queda igual.`, pan());
      }
      r.edges[k] = old;
    }
    r.nodes[u] = 'done';
  }
  const path = []; let x = target; while (x) { path.unshift(x); x = prev[x]; }
  for (let i = 1; i < path.length; i++) r.edges[ek(g, path[i - 1], path[i])] = 'path';
  r.push(`Todos etiquetados. Camino de A a ${target}: se reconstruye <b>de atrás hacia adelante</b> con prev: ${path.slice().reverse().join(' ← ')}. Resultado: <b>${path.join(' → ')}</b> con costo <b>${d[target]}</b>. Ojo: ir directo A→B costaba 4, pero A→D→B cuesta 3.`, pan());
  return r.steps;
}

function genBF(g) {
  const N = ['S', 'A', 'B', 'C', 'D'], r = recorder();
  const d = {}, prev = {};
  N.forEach(n => { d[n] = Infinity; prev[n] = null; r.labels[n] = '∞'; });
  d.S = 0; r.labels.S = '0'; r.nodes.S = 'front';
  const order = g.edges.map(e => `${e[0]}→${e[1]}`).join(', ');
  const pan = (round) => `<div class="plabel">Ronda ${round} de máximo |V|−1 = 4 · orden de los arcos: ${order}</div>` + distTable(N, d, prev, null, n => n === 'S' ? 'origen' : '');
  r.push('Inicio: d(S) = 0, el resto ∞. Ojo: Dijkstra aquí fallaría. Fijaría A con 2 (S→A) sin ver que S→B→A cuesta 5 − 4 = 1.', pan(0));
  for (let round = 1; round <= N.length - 1; round++) {
    let changed = false;
    for (const [u, v, w] of g.edges) {
      const k = ek(g, u, v), old = r.edges[k]; r.edges[k] = 'try';
      if (d[u] === Infinity) { r.push(`Ronda ${round}, arco ${u}→${v}: d(${u}) es ∞, todavía no se puede usar.`, pan(round)); r.edges[k] = old; continue; }
      const alt = d[u] + w;
      if (alt < d[v]) {
        const before = d[v];
        if (prev[v]) r.edges[ek(g, prev[v], v)] = '';
        d[v] = alt; prev[v] = u; r.labels[v] = String(alt); r.nodes[v] = 'front'; changed = true;
        r.edges[k] = 'tree';
        r.push(`Ronda ${round}, arco ${u}→${v}: ${d[u]} + (${w}) = ${alt} &lt; ${fmt(before)} → <b>actualizamos</b> d(${v}) = ${alt}.${w < 0 ? ' ¡El arco negativo funciona como una recompensa!' : ''}`, pan(round));
      } else {
        r.edges[k] = old;
        r.push(`Ronda ${round}, arco ${u}→${v}: ${d[u]} + (${w}) = ${alt} ≥ ${fmt(d[v])} → sin cambio.`, pan(round));
      }
    }
    if (!changed) {
      N.forEach(n => r.nodes[n] = 'done');
      r.push(`En la ronda ${round} <b>no cambió nada</b>, así que paramos aquí: no hace falta llegar a |V|−1 = 4 rondas. Con este orden de arcos hicieron falta ${round} rondas; con un orden mejor (S→A, S→B, B→A, A→C, C→D, B→D) bastaría una sola pasada más la de verificación.`, pan(round));
      break;
    }
  }
  r.push('Resultado: d(A) = 1, d(C) = 2, d(D) = 5. Para detectar un <b>ciclo negativo</b>: si después de |V|−1 rondas todavía se pudiera mejorar algo, habría un ciclo negativo y no existiría camino mínimo.', pan('final'));
  return r.steps;
}

function genFloyd(g) {
  const N = Object.keys(g.pos).sort(), n = N.length, r = recorder();
  const D = N.map(i => N.map(j => i === j ? 0 : Infinity));
  g.edges.forEach(([u, v, w]) => { D[N.indexOf(u)][N.indexOf(v)] = w; });
  const mat = (k, chg) => `<div class="tscroll"><table class="t"><tr><th></th>${N.map((c, j) => `<th class="${j === k ? 'kk' : ''}">${c}</th>`).join('')}</tr>${D.map((row, i) => `<tr><th class="${i === k ? 'kk' : ''}">${N[i]}</th>${row.map((x, j) => `<td class="${chg.has(i + ',' + j) ? 'chg' : ((i === k || j === k) ? 'kk' : '')}">${fmt(x)}</td>`).join('')}</tr>`).join('')}</table></div>`;
  r.push('Inicialización (k = 0): en cada celda va el peso del arco directo, ∞ si no hay arco y 0 en la diagonal. Este es el mismo grafo de la clase 08.', mat(-1, new Set()));
  for (let k = 0; k < n; k++) {
    const chg = new Set(), msgs = [];
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      if (D[i][k] + D[k][j] < D[i][j]) {
        msgs.push(`d(${N[i]},${N[j]}): ${fmt(D[i][j])} → ${D[i][k]} + ${D[k][j]} = ${D[i][k] + D[k][j]}`);
        D[i][j] = D[i][k] + D[k][j]; chg.add(i + ',' + j);
      }
    }
    r.nodes = {}; r.nodes[N[k]] = 'cur';
    for (let q = 0; q < k; q++) r.nodes[N[q]] = 'done';
    r.push(`Fase k = ${k + 1}: ¿sale más barato ir de i a j haciendo escala en <b>${N[k]}</b>? Se aplica d[i][j] = min(d[i][j], d[i][${N[k]}] + d[${N[k]}][j]). ${msgs.length ? 'Cambios: <b>' + msgs.join('; ') + '</b>.' : '<b>No hay cambios</b>: ningún camino mejora pasando por ' + N[k] + '.'}`, mat(k, chg));
  }
  r.nodes = {}; N.forEach(x => r.nodes[x] = 'done');
  r.push('Después de la fase k = 5 la matriz tiene la distancia mínima entre cada par de nodos (∞ = no hay camino). Fila A: 0, 2, 6, 1, 4.', mat(-1, new Set()));
  return r.steps;
}

function compTable(N, comp) { return `<div class="plabel">Vector de componentes (vector paralelo)</div><div class="tscroll"><table class="t"><tr>${N.map(n => `<th>${n}</th>`).join('')}</tr><tr>${N.map(n => `<td>${comp[n]}</td>`).join('')}</tr></table></div>`; }

function genKruskal(g, mode = 'min') {
  const N = Object.keys(g.pos).sort(), r = recorder();
  const E = g.edges.slice().sort((a, b) => mode === 'min' ? a[2] - b[2] : b[2] - a[2]);
  const comp = {}; N.forEach((n, i) => comp[n] = i + 1);
  const status = {}; let taken = 0, total = 0;
  const pan = () => compTable(N, comp) + `<div class="plabel">Aristas ordenadas ${mode === 'min' ? 'de menor a mayor' : 'de MAYOR a menor'}</div><div class="q-items">${E.map(([u, v, w]) => { const k = u + v; const s = status[k]; return `<span class="estatus ${s === 'ok' ? 'ok' : s === 'no' ? 'no' : ''}" style="border:1px solid var(--line)">${u}${v}·${w}</span>`; }).join('')}</div>`;
  r.push(`Cada vértice empieza como su propio árbol: un bosque de ${N.length} árboles. Ordenamos las aristas ${mode === 'min' ? 'de la más barata a la más cara' : 'de la más cara a la más barata (árbol MÁXIMO)'}.`, pan());
  for (const [u, v, w] of E) {
    if (taken === N.length - 1) break;
    const k = ek(g, u, v);
    if (comp[u] !== comp[v]) {
      const a = Math.min(comp[u], comp[v]), b = Math.max(comp[u], comp[v]);
      N.forEach(n => { if (comp[n] === b) comp[n] = a; });
      r.edges[k] = 'tree'; r.nodes[u] = r.nodes[v] = 'done'; status[u + v] = 'ok'; taken++; total += w;
      r.push(`Arista <b>${u}–${v} (${w})</b>: ${u} y ${v} estaban en componentes distintas → <b>se agrega</b> y se unen (todos los de la componente ${b} pasan a ser ${a}). Llevamos ${taken} de ${N.length - 1} aristas.`, pan());
    } else {
      r.edges[k] = 'reject'; status[u + v] = 'no';
      r.push(`Arista <b>${u}–${v} (${w})</b>: ${u} y ${v} ya tienen la misma componente (${comp[u]}) → formaría un <b>ciclo</b>, se descarta.`, pan());
    }
  }
  r.push(`Ya hay n − 1 = ${N.length - 1} aristas: el bosque quedó en un solo árbol. Peso total del árbol cobertor ${mode === 'min' ? 'mínimo' : 'MÁXIMO'}: <b>${total}</b>.`, pan());
  return r.steps;
}

function genPrim(g, mode = 'min') {
  const N = Object.keys(g.pos).sort(), r = recorder();
  const inT = { A: true }, chosen = []; let total = 0;
  r.nodes.A = 'done';
  const pan = (cands) => qbox('En el árbol', N.filter(n => inT[n])) + qbox('Candidatas (salen del árbol hacia afuera)', (cands || []).map(([u, v, w]) => `${u}${v}·${w}`));
  r.push('Empezamos en <b>A</b>. El subárbol tiene un solo vértice.', pan());
  while (Object.keys(inT).length < N.length) {
    const c = g.edges.filter(([u, v]) => !!inT[u] !== !!inT[v]);
    c.forEach(([u, v]) => r.edges[ek(g, u, v)] = 'try');
    r.push(`Miramos todas las aristas con un extremo <b>dentro</b> del subárbol y otro <b>fuera</b>: ${c.map(([u, v, w]) => `${u}–${v} (${w})`).join(', ')}.`, pan(c));
    const best = c.reduce((b, e) => (mode === 'min' ? e[2] < b[2] : e[2] > b[2]) ? e : b);
    c.forEach(([u, v]) => { const k = ek(g, u, v); if (r.edges[k] === 'try') delete r.edges[k]; });
    const [u, v, w] = best, nw = inT[u] ? v : u;
    inT[nw] = true; r.edges[ek(g, u, v)] = 'tree'; r.nodes[nw] = 'done'; total += w; chosen.push(best);
    r.push(`La ${mode === 'min' ? 'más barata' : 'más cara'} es <b>${u}–${v} (${w})</b>: la agregamos y <b>${nw}</b> entra al subárbol. Nunca forma ciclo, porque une uno de adentro con uno de afuera.`, pan());
  }
  r.push(`El subárbol ya contiene todos los vértices. Peso total: <b>${total}</b>, el mismo que con Kruskal${mode === 'min' ? '' : ' en modo máximo'}.`, pan());
  return r.steps;
}

function genBoruvka(g) {
  const N = Object.keys(g.pos).sort(), r = recorder();
  const comp = {}; N.forEach((n, i) => comp[n] = i + 1);
  let total = 0, round = 0;
  const groups = () => { const m = {}; N.forEach(n => (m[comp[n]] = m[comp[n]] || []).push(n)); return m; };
  const pan = () => `<div class="plabel">Componentes (buckets)</div><div class="q-items">${Object.values(groups()).map(gr => `<span class="qi">{${gr.join(',')}}</span>`).join('')}</div>`;
  r.push(`Cada vértice es su propia componente: ${N.length} componentes.`, pan());
  while (Object.keys(groups()).length > 1) {
    round++;
    const gs = groups(), pick = {}, lines = [];
    Object.entries(gs).forEach(([cid, members]) => {
      let best = null;
      g.edges.forEach(e => { const [u, v, w] = e; const inU = comp[u] == cid, inV = comp[v] == cid; if (inU !== inV && (!best || w < best[2])) best = e; });
      if (best) { pick[ek(g, best[0], best[1])] = best; lines.push(`{${members.join(',')}} → ${best[0]}–${best[1]} (${best[2]})`); }
    });
    Object.keys(pick).forEach(k => r.edges[k] = 'try');
    r.push(`Ronda ${round}: <b>cada componente, al mismo tiempo</b>, elige su arista más barata hacia otra componente: ${lines.join('; ')}.`, pan());
    Object.entries(pick).forEach(([k, [u, v, w]]) => {
      if (comp[u] !== comp[v]) { const a = Math.min(comp[u], comp[v]), b = Math.max(comp[u], comp[v]); N.forEach(n => { if (comp[n] === b) comp[n] = a; }); total += w; r.edges[k] = 'tree'; r.nodes[u] = r.nodes[v] = 'done'; }
      else r.edges[k] = 'tree';
    });
    r.push(`Agregamos todas esas aristas a la vez (las repetidas cuentan una sola vez) y fusionamos componentes. Quedan ${Object.keys(groups()).length}.`, pan());
  }
  r.push(`Queda una sola componente en ${round} rondas: es el árbol cobertor mínimo, peso <b>${total}</b>. Mismo árbol que Kruskal y Prim, porque los pesos son todos distintos.`, pan());
  return r.steps;
}

  { id: 'floyd', cat: 'Caminos de costo mínimo', name: 'Floyd-Warshall', short: 'Todos los pares a la vez: ¿conviene hacer escala en k?', anim: g => genFloyd(G_FLOYD), graph: G_FLOYD,

  { id: 'kruskal', cat: 'Árboles cobertores', name: 'Kruskal', short: 'Ordena las aristas y toma las que no forman ciclo.', anim: (m) => genKruskal(G_MAIN, m), graph: G_MAIN, modes: true,

        ${[['Definir 4 o 5 conceptos (1 pt c/u)', 3], ['Describir DFS o BFS y sus estructuras', 3], ['Dijkstra: camino de costo mínimo', 3], ['Paralelismo o costos negativos', 2], ['Representación de grafos', 1], ['Árbol cobertor máximo', 1], ['Puentes de Königsberg', 1]].map(([t, n]) => `<div class="it"><span>${t}</span><span class="mono">${n}/3</span><div class="bar"><i style="width:${n / 3 * 100}%"></i></div></div>`).join('')}
      </div>
    </div>

    <div class="stack kb">
      <h2>Prueba: los puentes de Königsberg</h2>
      <p class="muted">4 zonas (vértices) y 7 puentes (aristas). Agrega puentes y mira cómo cambian los grados.</p>
      <div class="card stack">
        <div id="kbsvg"></div>
        <p class="msg" id="kbmsg"></p>
        <div class="row"><button class="btn accent" id="kbadd">Agregar puente</button><button class="btn ghost" id="kbreset">Reiniciar</button></div>
      </div>
    </div>

    <div class="stack">
      <h2>Ojo con tus apuntes</h2>
      <p class="muted">Detalles de las notas y de un examen resuelto que conviene corregir antes del parcial.</p>
      ${GLOS.filter(x => x.o).map(x => `<div class="ojo"><b>${x.t}</b>${x.o}</div>`).join('')}
      <div class="ojo"><b>Königsberg con un solo puente</b>Una respuesta del diferido dice que con un puente más ya existe un "ciclo euleriano". Con 1 puente quedan 2 vértices impares: hay camino euleriano, pero no regresa al inicio. Para el circuito hacen falta 2 puentes.</div>
      <div class="ojo"><b>Flujo máximo con costo mínimo</b>En las notas aparece que "no se puede". En la teoría general sí existe ese problema y tiene solución. Pregúntale a la profe qué respuesta espera.</div>
    </div>
  </section>`;
  // Königsberg
  const P = { A: [190, 120], B: [190, 30], C: [190, 215], D: [330, 120] };
  const base = [['A','B',-28],['A','B',28],['A','C',-28],['A','C',28],['A','D',0],['B','D',0],['C','D',0]];
  const extra = [['B','C',150],['A','D',-36]];
  let added = 0;
  const draw = () => {
    const E = base.concat(extra.slice(0, added)), deg = { A: 0, B: 0, C: 0, D: 0 };
    let s = '<rect x="0" y="0" width="380" height="245" fill="none"/>';
    s += '<path d="M0 78 C 90 70, 120 70, 150 82 S 260 70, 380 84" stroke="var(--tree-soft)" stroke-width="26" fill="none"/><path d="M0 165 C 90 172, 120 172, 150 160 S 260 172, 380 160" stroke="var(--tree-soft)" stroke-width="26" fill="none"/>';
    E.forEach(([u, v, bend], i) => {
      deg[u]++; deg[v]++;
      const [x1, y1] = P[u], [x2, y2] = P[v], mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
      const cx = mx - dy / L * bend, cy = my + dx / L * bend, isNew = i >= base.length;
      if (u === 'B' && v === 'C') s += `<path d="M${x1} ${y1} C 40 40, 40 205, ${x2} ${y2}" class="e ${isNew ? 'path' : ''}" />`;
      else s += `<path d="M${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}" class="e ${isNew ? 'path' : ''}" style="${isNew ? '' : 'stroke:var(--muted)'}"/>`;
    });
    Object.entries(P).forEach(([n, [x, y]]) => {
      const odd = deg[n] % 2;
      s += `<g class="n ${odd ? 'cur' : 'done'}"><circle cx="${x}" cy="${y}" r="17"/><text x="${x}" y="${y + 1}">${n}</text></g><text class="nl" x="${x + 30}" y="${y + 5}">g=${deg[n]}</text>`;
    });
    $('#kbsvg').innerHTML = `<svg viewBox="0 0 380 245" role="img" aria-label="Grafo de Königsberg">${s}</svg>`;
    const odd = Object.values(deg).filter(d => d % 2).length;
    $('#kbmsg').innerHTML = odd === 4 ? '4 vértices de grado impar (en naranja): no hay camino euleriano. Euler tenía razón.' : odd === 2 ? 'Quedan 2 impares: ya existe un <span style="color:var(--accent)">camino euleriano</span>, empezando en uno impar y terminando en el otro. Pero no vuelve al inicio.' : 'Todos los grados son pares: existe un <span style="color:var(--tree)">circuito euleriano</span>. Cruzas cada puente una vez y vuelves a casa.';
    $('#kbadd').disabled = added >= extra.length;
  };
  $('#kbadd').onclick = () => { added++; draw(); };
  $('#kbreset').onclick = () => { added = 0; draw(); };
  draw();
}

function player(container, makeSteps, g, opts = {}) {
  let steps = makeSteps(opts.mode), i = 0, timer = null;
  container.innerHTML = `<div class="player">
    ${opts.modes ? `<div class="row"><span class="plabel">Árbol:</span><div class="toggle" role="group"><button data-m="min" aria-pressed="true">Mínimo</button><button data-m="max" aria-pressed="false">Máximo</button></div></div>` : ''}
    <div class="gwrap"><div class="gsvg"></div>${LEGEND}</div>
    <div class="prog"><i></i></div>
    <div class="ptext" aria-live="polite"></div>
    <div class="pctl">
      <button class="btn ghost b-reset" aria-label="Reiniciar">⟲</button>
      <button class="btn ghost b-prev">‹ Atrás</button>
      <button class="btn primary b-next">Siguiente ›</button>
      <button class="btn ghost b-play">Auto</button>
    </div>
    <div class="pcount"></div>
    <div class="panel"></div>
  </div>`;
  const render = () => {
    const s = steps[i];
    $('.gsvg', container).innerHTML = drawGraph(g, s);
    $('.ptext', container).innerHTML = s.text;
    $('.panel', container).innerHTML = s.panel || '';
    $('.pcount', container).textContent = `Paso ${i + 1} de ${steps.length}`;
    $('.prog i', container).style.width = ((i + 1) / steps.length * 100) + '%';
    $('.b-prev', container).disabled = i === 0;
    $('.b-next', container).disabled = i === steps.length - 1;
  };
  const stop = () => { clearInterval(timer); timer = null; $('.b-play', container).textContent = 'Auto'; };
  $('.b-next', container).onclick = () => { if (i < steps.length - 1) { i++; render(); } };
  $('.b-prev', container).onclick = () => { stop(); if (i > 0) { i--; render(); } };
  $('.b-reset', container).onclick = () => { stop(); i = 0; render(); };
  $('.b-play', container).onclick = () => {
    if (timer) return stop();
    if (i === steps.length - 1) i = 0;
    $('.b-play', container).textContent = 'Pausa';
    timer = setInterval(() => { if (i < steps.length - 1) { i++; render(); } else stop(); }, 1700);
  };
  $$('.toggle button', container).forEach(b => b.onclick = () => {
    stop(); $$('.toggle button', container).forEach(x => x.setAttribute('aria-pressed', x === b));
    steps = makeSteps(b.dataset.m); i = 0; render();
  });
  render();
  return stop;
}

function walkWidget(el) {
  const g = G_MAIN, A = adjOf(g), N = Object.keys(g.pos);
  let at = 'A', cnt = {}, steps = 0; N.forEach(n => cnt[n] = 0); cnt.A = 1;
  el.innerHTML = `<div class="gwrap"><div class="wsvg"></div></div><p class="ptext" id="wmsg"></p><div class="row"><button class="btn primary" id="w1">Dar 1 paso</button><button class="btn ghost" id="w100">Dar 100 pasos</button><button class="btn ghost" id="w0">Reiniciar</button></div>`;
  const render = (msg) => {
    const labels = {}; N.forEach(n => labels[n] = steps ? Math.round(cnt[n] / (steps + 1) * 100) + '%' : '');
    $('.wsvg', el).innerHTML = drawGraph(g, { nodes: { [at]: 'cur' }, labels });
    $('#wmsg', el).innerHTML = msg || 'El borracho está en <b>A</b>. Cada paso elige un vecino al azar, sin importar de dónde viene. Los porcentajes muestran cuánto tiempo pasa en cada nodo.';
  };
  const step = () => { const nb = A[at]; const nx = nb[Math.floor(Math.random() * nb.length)][0]; const from = at; at = nx; cnt[at]++; steps++; return [from, nb.length]; };
  $('#w1', el).onclick = () => { const [from, k] = step(); render(`Estaba en <b>${from}</b>, que tiene ${k} vecinos: cada uno con probabilidad 1/${k}. Fue a <b>${at}</b>. Pasos: ${steps}.`); };
  $('#w100', el).onclick = () => { for (let i = 0; i < 100; i++) step(); render(`Van ${steps} pasos. Ahora está en <b>${at}</b>. Fíjate que los nodos con más vecinos (B y E) reciben más visitas: en la larga, la frecuencia es proporcional al grado.`); };
  $('#w0', el).onclick = () => { at = 'A'; steps = 0; N.forEach(n => cnt[n] = 0); cnt.A = 1; render(); };
  render();
}

  let i = 0, score = 0, streak = 0, bestStreak = 0; const missed = [];
  const show = () => {
    const q = qs[i], order = shuffle(q.o.map((t, k) => ({ t, k })));
    app.innerHTML = `<section class="qcard">
      <div class="qhead"><span>${TOPICS[q.t]} · ${i + 1}/${qs.length}</span><span>${score} correctas${streak >= 2 ? ` · <span class="streak">racha ${streak}</span>` : ''}</span></div>
      <div class="prog"><i style="width:${i / qs.length * 100}%"></i></div>
      <p class="qtext">${q.q}</p>
      <div class="opts">${order.map((o, j) => `<button class="opt" data-k="${o.k}"><span class="k">${'ABCD'[j]}</span><span>${o.t}</span></button>`).join('')}</div>
      <div id="qexp"></div>
    </section>`;
    $$('.opt').forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === q.a;
      $$('.opt').forEach(x => { x.disabled = true; if (+x.dataset.k === q.a) x.classList.add('ok'); });
      if (!ok) { b.classList.add('ko'); missed.push(q); streak = 0; } else { score++; streak++; bestStreak = Math.max(bestStreak, streak); }
      $('#qexp').innerHTML = `<div class="stack"><div class="exp ${ok ? 'ok' : 'ko'}"><b>${ok ? (streak >= 3 ? '¡Vas en racha!' : '¡Correcto!') : 'Casi. La correcta está en verde.'}</b>${q.e}</div><button class="btn primary" id="qnext" style="justify-content:center">${i < qs.length - 1 ? 'Siguiente pregunta' : 'Ver resultado'}</button></div>`;
      $('#qnext').onclick = () => { i++; i < qs.length ? show() : end(); };
      $('#qnext').focus();
    });
    window.scrollTo(0, 0);
  };
  const end = () => {
    const pct = Math.round(score / qs.length * 100), prev = store.get('quizBest', 0);
    if (qs.length >= 10 && pct > prev) store.set('quizBest', pct);
    const nota = (score / qs.length * 20).toFixed(1);
    app.innerHTML = `<section class="stack-lg">
      <div class="card stack" style="text-align:center;align-items:center">
        <div class="eyebrow">Resultado</div>
        <div class="score-big">${score}/${qs.length}</div>
        <p>${pct >= 90 ? '¡Listo para el parcial!' : pct >= 70 ? 'Muy bien. Repasa las que fallaste y vuelve.' : pct >= 50 ? 'Vas bien encaminado. Revisa los algoritmos de los temas que fallaste.' : 'Arranca por el glosario y los algoritmos animados, y vuelve a intentarlo.'}</p>
        <p class="muted mono">≈ ${nota}/20 · mejor racha ${bestStreak}${qs.length >= 10 && pct > prev ? ' · ¡nuevo récord!' : ''}</p>
        <div class="row" style="justify-content:center"><button class="btn primary" id="again">Otra ronda</button>${missed.length ? '<button class="btn accent" id="retry">Repetir las falladas</button>' : ''}<a class="btn ghost" href="#quiz" style="text-decoration:none" id="back">Menú del quiz</a></div>
      </div>
      ${missed.length ? `<div class="stack"><h3>Para repasar</h3>${missed.map(q => `<div class="card stack"><span class="tag">${TOPICS[q.t]}</span><b>${q.q}</b><span><span style="color:var(--good);font-weight:700">Respuesta:</span> ${q.o[q.a]}</span><span class="muted">${q.e}</span></div>`).join('')}</div>` : ''}
    </section>`;
    $('#again').onclick = () => runQuiz(shuffle(MCQ).slice(0, qs.length));
    if (missed.length) $('#retry').onclick = () => runQuiz(shuffle(missed));
    $('#back').onclick = (e) => { e.preventDefault(); viewQuiz(); };
    window.scrollTo(0, 0);
  };
  if (!qs.length) { viewQuiz(); return; }
  show();
}

function runOpen() {
  const st = store.get('open', {});
  const pool = OPEN.map((q, idx) => ({ ...q, idx })).sort((a, b) => (st[a.idx] === 'ok') - (st[b.idx] === 'ok'));
  let i = 0;
  const show = () => {
    const q = pool[i];
    app.innerHTML = `<section class="qcard">
      <div class="qhead"><span>${q.src}</span><span>${i + 1}/${pool.length}</span></div>
      <div class="prog"><i style="width:${i / pool.length * 100}%"></i></div>
      <p class="qtext">${q.q}</p>
      <p class="muted">Piensa tu respuesta (o escríbela en papel) antes de mirar.</p>
      <button class="btn primary" id="reveal" style="justify-content:center">Ver respuesta modelo</button>
      <div id="ans"></div>
      <div class="row"><button class="btn ghost" id="oprev" ${i === 0 ? 'disabled' : ''}>‹ Anterior</button><button class="btn ghost" id="oskip">${i < pool.length - 1 ? 'Saltar ›' : 'Terminar'}</button></div>
    </section>`;
    $('#reveal').onclick = () => {
      $('#reveal').hidden = true;
      $('#ans').innerHTML = `<div class="answer card"><div class="plabel">Respuesta modelo</div><p>${q.a}</p><div class="plabel">No puede faltar</div><ul class="checklist">${q.k.map(x => `<li><span>${x}</span></li>`).join('')}</ul>
        <div class="plabel">¿Cómo te fue?</div><div class="rate"><button class="btn" data-r="no">Repasar</button><button class="btn" data-r="mid">Más o menos</button><button class="btn accent" data-r="ok">La sabía</button></div></div>`;
      $$('.rate .btn').forEach(b => b.onclick = () => { st[q.idx] = b.dataset.r; store.set('open', st); next(); });
    };
    $('#oprev').onclick = () => { if (i > 0) { i--; show(); } };
    $('#oskip').onclick = next;
    window.scrollTo(0, 0);
  };
  const next = () => { i++; if (i < pool.length) show(); else { const m = Object.values(st).filter(v => v === 'ok').length; app.innerHTML = `<section class="card stack" style="text-align:center;align-items:center"><div class="eyebrow">Ronda terminada</div><div class="score-big">${m}/${OPEN.length}</div><p>preguntas de desarrollo marcadas como "La sabía". Las que no, vuelven primero en la próxima ronda.</p><div class="row" style="justify-content:center"><button class="btn primary" id="oagain">Otra ronda</button><button class="btn ghost" id="omenu">Menú del quiz</button></div></section>`; $('#oagain').onclick = runOpen; $('#omenu').onclick = viewQuiz; } };
  show();
}

/* ---------- relacionar ---------- */
function viewRelacionar() {
  let mode = 'def', timer = null;
  const setup = () => {
    app.innerHTML = `<section class="stack">
      <div class="eyebrow">Relacionar</div><h2>Une cada término con su definición</h2>
      <p class="muted">Toca un término y luego su definición. 5 pares por ronda, contra reloj. Cada error suma 3 segundos.</p>
      <div class="row" style="justify-content:space-between"><div class="toggle" id="mm"><button data-m="def" aria-pressed="${mode === 'def'}">Definiciones</button><button data-m="alg" aria-pressed="${mode === 'alg'}">Algoritmos</button></div><span class="timer" id="tm">0.0s</span></div>
      <div class="mgrid"><div class="mcol" id="mt"></div><div class="mcol" id="md"></div></div>
      <p class="muted mono" id="mstat"></p>
      <div id="mend"></div>
    </section>`;
    $$('#mm button').forEach(b => b.onclick = () => { mode = b.dataset.m; clearInterval(timer); setup(); });
    round();
  };
  const round = () => {
    const src = mode === 'def' ? GLOS.map(x => [x.t, x.s]) : ALG_PAIRS;
    const pairs = shuffle(src).slice(0, 5);
    let selT = null, done = 0, errs = 0, t0 = null;
    const best = store.get(mode === 'def' ? 'matchBest' : 'matchBestAlg', null);
    $('#mstat').textContent = best ? `Récord: ${best}s` : 'Aún sin récord en este modo.';
    $('#mend').innerHTML = '';
    $('#mt').innerHTML = pairs.map((p, k) => `<button class="mbtn term" data-k="${k}">${p[0]}</button>`).join('');
    $('#md').innerHTML = shuffle(pairs.map((p, k) => ({ p, k }))).map(({ p, k }) => `<button class="mbtn" data-k="${k}">${p[1]}</button>`).join('');
    clearInterval(timer); $('#tm').textContent = '0.0s';
    const start = () => { if (t0) return; t0 = Date.now(); timer = setInterval(() => { const el = $('#tm'); if (el) el.textContent = ((Date.now() - t0) / 1000 + errs * 3).toFixed(1) + 's'; }, 100); };
    $$('#mt .mbtn').forEach(b => b.onclick = () => { if (b.classList.contains('done')) return; start(); $$('#mt .mbtn').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); selT = b; });
    $$('#md .mbtn').forEach(b => b.onclick = () => {
      if (b.classList.contains('done') || !selT) return;
      if (b.dataset.k === selT.dataset.k) {
        b.classList.add('done'); selT.classList.add('done'); selT.classList.remove('sel'); b.disabled = selT.disabled = true; selT = null; done++;
        if (done === 5) {
          clearInterval(timer);
          const secs = +((Date.now() - t0) / 1000 + errs * 3).toFixed(1);
          const key = mode === 'def' ? 'matchBest' : 'matchBestAlg', rec = !best || secs < best;
          if (rec) store.set(key, secs);
          $('#tm').textContent = secs + 's';
          $('#mend').innerHTML = `<div class="card stack" style="text-align:center;align-items:center"><div class="score-big">${secs}s</div><p>${errs ? `${errs} error${errs > 1 ? 'es' : ''} (+${errs * 3}s).` : 'Sin errores.'} ${rec ? '¡Nuevo récord!' : `Récord: ${best}s.`}</p><button class="btn primary" id="mnext">Otra ronda</button></div>`;
          $('#mnext').onclick = round;
        }
      } else {
        errs++; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
        setTimeout(() => b.classList.remove('wrong'), 400);
      }
    });
  };
  setup();
  return () => clearInterval(timer);
}

/* ---------- router ---------- */
function route() {
  if (typeof cleanup === 'function') { cleanup(); cleanup = null; }
  const h = (location.hash || '#inicio').slice(1);
  let tab = h.startsWith('alg-') ? 'algoritmos' : h;
  if (!['inicio', 'glosario', 'algoritmos', 'quiz', 'relacionar'].includes(tab)) tab = 'inicio';
  $$('nav.tabs a').forEach(a => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (h.startsWith('alg-')) return viewAlg(h.slice(4));
  ({ inicio: viewInicio, glosario: viewGlosario, algoritmos: viewAlgoritmos, quiz: viewQuiz, relacionar: () => { cleanup = viewRelacionar(); } })[tab]();
  if (!h.startsWith('alg-')) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>

</body></html>
